name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: asc_ehr
          POSTGRES_USER: asc
          POSTGRES_PASSWORD: asc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asc -d asc_ehr"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize Postgres runtime role and migrations
        run: |
          PGPASSWORD=asc psql -h localhost -U asc -d asc_ehr -f docker/postgres/init/01-runtime-role.sql
          PGPASSWORD=asc psql -h localhost -U asc -d asc_ehr -c "ALTER ROLE asc_app WITH PASSWORD 'asc_app_dev_only';"
          DATABASE_URL=postgresql://asc:asc@localhost:5432/asc_ehr pnpm db:migrate

      - name: Type check
        run: pnpm check-types

      - name: Lint
        run: pnpm lint

      - name: Unit and integration tests
        env:
          CI: true
          TEST_DATABASE_URL: postgresql://asc:asc@localhost:5432/asc_ehr
          TEST_RUNTIME_DATABASE_URL: postgresql://asc_app:asc_app_dev_only@localhost:5432/asc_ehr
        run: pnpm test

      - name: Agent evaluation gate
        env:
          CI: true
        run: pnpm eval

      - name: Production build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_PUBLIC_MEDPLUM_BASE_URL: http://localhost:8103
          NEXT_PUBLIC_MEDPLUM_CLIENT_ID: ci-test-client-id
        run: pnpm build

      - name: Web bundle size and leak verification
        run: pnpm --filter web test:bundles
