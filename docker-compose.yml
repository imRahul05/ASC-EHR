# Local development services. NOT used for staging/production (Azure Postgres
# Flexible Server with encryption at rest, TLS and least-privilege roles — see
# docs/decisions/2026-09-26-adopt-postgres-with-drizzle-for-application-data.md).
#
#   pnpm db:up        start Postgres (waits until healthy)
#   pnpm db:migrate   apply packages/db/drizzle migrations
#   pnpm db:down      stop (data persists in the named volume; add -v to wipe)
#
# Never load real PHI into this database.
name: asc-ehr

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      # DEV-ONLY credentials for a local, throwaway database. Never reuse them anywhere else.
      POSTGRES_DB: asc_ehr
      POSTGRES_USER: asc
      POSTGRES_PASSWORD: asc
    ports:
      # Bound to localhost only. URL: postgres://asc:asc@localhost:5432/asc_ehr
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the non-owner runtime login (asc_app); runs on a new volume only.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asc -d asc_ehr"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Local Medplum (P02): FHIR server, its own Postgres and Redis, and the admin app. ---
  # Host ports are unusual on purpose so they do not collide with other local stacks
  # (5432/6379/8103/3000 are common). All bound to localhost.
  # No password is committed: `pnpm medplum:up` generates them per machine into the
  # git-ignored infra/medplum/.local and passes them in with --env-file. The services are in
  # the "medplum" profile, so `docker compose up` and `pnpm db:up` never start them.
  #   pnpm medplum:up     generate credentials (once), start the stack, wait until healthy
  #   pnpm medplum:seed   create the project, facility, practitioners and client apps
  #   pnpm medplum:down   stop (data persists in the named volumes)
  medplum-postgres:
    image: postgres:16-alpine
    container_name: asc-medplum-postgres
    profiles: ["medplum"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: medplum
      POSTGRES_USER: medplum
      POSTGRES_PASSWORD: ${MEDPLUM_DB_PASSWORD:-}
    ports:
      - "127.0.0.1:5443:5432"
    volumes:
      - medplum-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medplum -d medplum"]
      interval: 5s
      timeout: 5s
      retries: 10

  medplum-redis:
    image: redis:7-alpine
    container_name: asc-medplum-redis
    profiles: ["medplum"]
    restart: unless-stopped
    # An empty --requirepass means NO password, so refuse to start without one (for example when
    # started without --env-file). The default stays empty so plain compose commands still parse.
    command:
      - sh
      - -c
      - 'test -n "$$REDIS_PASSWORD" || { echo "MEDPLUM_REDIS_PASSWORD is not set: start the stack with pnpm medplum:up" >&2; exit 1; }; exec redis-server --requirepass "$$REDIS_PASSWORD"'
    environment:
      REDIS_PASSWORD: ${MEDPLUM_REDIS_PASSWORD:-}
      # redis-cli reads the password from here, so it is not on the healthcheck command line.
      REDISCLI_AUTH: ${MEDPLUM_REDIS_PASSWORD:-}
    ports:
      - "127.0.0.1:6390:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  medplum-server:
    image: medplum/medplum-server:5.1.42
    container_name: asc-medplum-server
    profiles: ["medplum"]
    restart: unless-stopped
    depends_on:
      medplum-postgres:
        condition: service_healthy
      medplum-redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8203:8103"
    volumes:
      # The server reads its config from the working directory; mounted read-only. Rendered by
      # `pnpm medplum:up` from infra/medplum/medplum.config.template.json (credentials generated per machine).
      # Long syntax with create_host_path: false, because the short form makes Docker create a
      # DIRECTORY at the host path when the file is missing, which then breaks the next render.
      - type: bind
        source: ./infra/medplum/.local/medplum.config.json
        target: /usr/src/medplum/medplum.config.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./infra/medplum/.local/medplum.config.json
        target: /usr/src/medplum/packages/server/medplum.config.json
        read_only: true
        bind:
          create_host_path: false
      - medplum-binary:/usr/src/medplum/binary
    healthcheck:
      # The image has no shell or curl: probe with node.
      test: ["CMD", "node", "-e", "fetch('http://localhost:8103/healthcheck').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  medplum-app:
    image: medplum/medplum-app:5.1.42
    container_name: asc-medplum-app
    profiles: ["medplum"]
    restart: unless-stopped
    depends_on:
      medplum-server:
        condition: service_healthy
    environment:
      MEDPLUM_BASE_URL: http://localhost:8203/
    ports:
      - "127.0.0.1:3003:3000"

volumes:
  postgres-data:
  medplum-postgres-data:
  medplum-binary:
